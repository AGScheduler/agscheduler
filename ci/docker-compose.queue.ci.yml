services:
  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd
    ports:
      - 127.0.0.1:4150:4150
      - 127.0.0.1:4151:4151

  rabbitmq:
    image: rabbitmq:4.4.1
    command:
      - sh
      - -c
      - rabbitmq-plugins enable --offline rabbitmq_management && exec rabbitmq-server
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672

  nanomq:
    image: emqx/nanomq:0.25.7
    ports:
      - 127.0.0.1:1883:1883

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - 127.0.0.1:9092:9092
