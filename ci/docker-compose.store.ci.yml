services:
  mysql:
    image: mysql:26.10.0
    environment:
      - MYSQL_DATABASE=agscheduler
      - MYSQL_ROOT_PASSWORD=123456
    ports:
      - 127.0.0.1:3306:3306

  redis:
    image: redis:8.10.3
    ports:
      - 127.0.0.1:6379:6379

  mongodb:
    # MongoDB 5.0+ requires a CPU with AVX support.
    image: mongo:4.4.29
    ports:
      - 127.0.0.1:27017:27017

  etcd:
    image: gcr.io/etcd-development/etcd:v3.7.4
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - 127.0.0.1:2379:2379

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - 127.0.0.1:9200:9200
