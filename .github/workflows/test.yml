name: test

on:
  push:
    branches: ["main", "test", "dev", "dev/*", "dev_*"]
  pull_request:
    branches: ["main", "test", "dev"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        go-version: [1.27.x]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: |
          go.work.sum
          **/go.sum

    - name: Start external services
      run: |
        make up-ci-services
  
    - name: Install dependencies
      run: |
        make install

    - name: Check dependency file drift
      run: |
        git diff --exit-code -- '**/go.mod' '**/go.sum' go.work go.work.sum

    - name: Format with gofmt
      run: |
        make format-check

    - name: Import sorting with goimports
      run: |
        make isort-check

    - name: Lint with golangci-lint
      run: |
        make lint

    - name: Check module dependency boundaries
      run: |
        make check-deps

    - name: Test with go test
      run: |
        make test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage/*.out
      env:
        fail_ci_if_error: true
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
